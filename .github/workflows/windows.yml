name: VacunaBI · ejecutable de Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'app.py'
      - 'etl.py'
      - 'dashboard_template.html'
      - 'frontend/**'
      - 'localidades.json'
      - 'decisiones.js'
      - 'chart.umd.min.js'
      - 'requirements.txt'
      - 'test_*.py'
      - 'test_*.cjs'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pywebview==5.3.2
      - name: Ejecutar pruebas sin consultar la API
        run: |
          python test_etl.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_etl_regression test_dashboard_template test_app_export test_release_integrity
      - name: Probar cálculos de decisiones
        run: node --test test_decisiones.cjs test_frontend.cjs
      - name: Compilar VacunaBI.exe
        run: >-
          python -m PyInstaller --onefile --windowed --name VacunaBI
          --add-data "dashboard_template.html:."
          --add-data "frontend:frontend"
          --add-data "localidades.json:."
          --add-data "decisiones.js:."
          --add-data "chart.umd.min.js:."
          app.py
      - name: Guardar ejecutable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VacunaBI-Windows
          path: dist/VacunaBI.exe
          if-no-files-found: error

  publish:
    name: Publicar V2.2.2 preliminar
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(v2.2.2):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Descargar el ejecutable de esta misma compilación
        uses: actions/download-artifact@v4
        with:
          name: VacunaBI-Windows
          path: release
      - name: Preparar ZIP
        run: |
          test -s release/VacunaBI.exe
          cd release
          zip -9 VacunaBI-Windows.zip VacunaBI.exe
      - name: Publicar release en modo preliminar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.2.2 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::La release v2.2.2 ya existe. No se reemplazará automáticamente."
            exit 1
          fi
          gh release create v2.2.2 release/VacunaBI-Windows.zip \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "VacunaBI 2.2.1 · estabilización de Windows" \
            --notes "VacunaBI V2.2.2 evita descargar de nuevo las fuentes al iniciar cuando existe una copia compatible de la misma versión. El ETL completo se ejecuta al pulsar **Actualizar datos**. Conserva la recarga segura de WebView2 y los filtros inteligentes de V2.2. **Preliminar:** verificar la apertura repetida, actualización manual y uso sin conexión en Windows antes de promover la release; ver docs/VALIDACION_WINDOWS.md." \
            --prerelease
