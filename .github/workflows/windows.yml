name: VacunaBI · ejecutable de Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'app.py'
      - 'etl.py'
      - 'dashboard_template.html'
      - 'frontend/**'
      - 'localidades.json'
      - 'decisiones.js'
      - 'chart.umd.min.js'
      - 'requirements.txt'
      - 'test_*.py'
      - 'test_*.cjs'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pywebview==5.3.2
      - name: Ejecutar pruebas sin consultar la API
        run: |
          python test_etl.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_etl_regression test_dashboard_template test_app_export test_release_integrity
      - name: Probar cálculos de decisiones
        run: node --test test_decisiones.cjs test_frontend.cjs
      - name: Compilar VacunaBI.exe
        run: >-
          python -m PyInstaller --onefile --windowed --name VacunaBI
          --add-data "dashboard_template.html:."
          --add-data "frontend:frontend"
          --add-data "localidades.json:."
          --add-data "decisiones.js:."
          --add-data "chart.umd.min.js:."
          app.py
      - name: Guardar ejecutable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VacunaBI-Windows
          path: dist/VacunaBI.exe
          if-no-files-found: error

  publish:
    name: Publicar V2.2.3 preliminar
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(v2.2.3):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Descargar el ejecutable de esta misma compilación
        uses: actions/download-artifact@v4
        with:
          name: VacunaBI-Windows
          path: release
      - name: Preparar ZIP
        run: |
          test -s release/VacunaBI.exe
          cd release
          zip -9 VacunaBI-Windows.zip VacunaBI.exe
      - name: Publicar release en modo preliminar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.2.3 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::La release v2.2.3 ya existe. No se reemplazará automáticamente."
            exit 1
          fi
          gh release create v2.2.3 release/VacunaBI-Windows.zip \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "VacunaBI 2.2.3 · optimización de consultas CKAN" \
            --notes "VacunaBI V2.2.3 ejecuta ambas consultas CKAN simultáneamente y pagina con concurrencia acotada, validando todos los registros antes de publicar. Conserva el inicio rápido y la actualización bajo demanda. **Preliminar:** la mejora de tiempo depende de la API y requiere medición en Windows; ver docs/VALIDACION_WINDOWS.md." \
            --prerelease

  promote:
    name: Promover V2.2.3 existente a release estable
    needs: build
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'release(promote-v2.2.3): publicar version estable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Comprobar tag y ZIP originales
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_SHA=$(gh api "repos/$GH_REPO/git/ref/tags/v2.2.3" --jq '.object.sha')
          test "$TAG_SHA" = "42f15838a6bc1988aebbbe6851b3170559f54936"
          gh release view v2.2.3 --repo "$GH_REPO" --json assets \
            --jq '.assets[].name' | grep -Fxq "VacunaBI-Windows.zip"
      - name: Publicar release estable sin reemplazar el ejecutable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v2.2.3 \
            --repo "$GH_REPO" \
            --prerelease=false \
            --latest \
            --notes "VacunaBI V2.2.3 mejora la descarga de las fuentes CKAN en paralelo y conserva la verificación de integridad, el inicio desde copia guardada y la actualización bajo demanda. Incluye VacunaBI-Windows.zip compilado en el commit 42f15838a6bc1988aebbbe6851b3170559f54936 y aprobado por GitHub Actions. La comprobación manual de rendimiento y funcionamiento en Windows sigue recomendada; ver docs/VALIDACION_WINDOWS.md."
