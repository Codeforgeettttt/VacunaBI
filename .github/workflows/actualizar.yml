# Pruebas sobre los cambios de código; actualización remota programada o manual.
name: VacunaBI · pruebas y datos

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *" # 06:00 hora de Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas de aplicación y ETL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar transformaciones originales
        run: python test_etl.py
      - name: Ejecutar regresiones y pruebas de interfaz
        run: python -m unittest -v test_etl_regression test_dashboard_template

  refresh:
    name: Actualizar datos y dashboard
    if: ${{ github.event_name != 'push' }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Consultar API y generar dashboard
        run: python etl.py
      - name: Preparar índice para publicación web
        run: cp salidas/dashboard.html salidas/index.html
      - name: Subir sitio a GitHub Pages
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: salidas
      - name: Publicar en GitHub Pages
        id: deploy
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
